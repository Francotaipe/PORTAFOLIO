<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Crear cuenta | Portafolio</title><link rel="stylesheet" href="css/estilos.css"></head>
<body>
<div class="auth-wrap"><div class="auth-card">
<div class="auth-top"><img class="auth-logo" src="assets/logo-upla.png" alt="UPLA"><h1>Crear cuenta</h1><p>Regístrate para administrar tus trabajos.</p></div>
<form id="registerForm">
<div class="form-group"><label>Nombre completo</label><input id="nombre" required></div>
<div class="form-group"><label>Correo electrónico</label><input id="registerEmail" type="email" required></div>
<div class="form-group"><label>Contraseña</label><input id="registerPassword" type="password" minlength="6" required></div>
<button class="primary-btn" type="submit">Crear cuenta</button><div id="regMsg" class="msg"></div>
</form>
<div class="link-center"><a href="login.html">Ya tengo una cuenta</a> · <a href="index.html">Volver al portafolio</a></div>
</div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/config.js"></script><script src="js/auth.js"></script>
</body></html>
